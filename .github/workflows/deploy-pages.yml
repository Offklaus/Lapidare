# Publica uma DEMONSTRAÇÃO do site no GitHub Pages (https://<usuario>.github.io/<repositorio>/).
# Só o front, em modo de exemplo (VITE_USE_MOCK=true): dados fictícios, sem API, sem painel da equipe
# e sem login. Para ativar: Settings → Pages → Source: "GitHub Actions" (uma vez).
name: Deploy da demonstração (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um novo push cancela o que ainda estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build em modo de exemplo
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'
          # O site fica em /<repositorio>/, não na raiz do domínio
          VITE_BASE: /${{ github.event.repository.name }}/

      # O Pages não sabe abrir rotas do React (ex.: /agendar) ao recarregar a página:
      # servindo o próprio app como 404.html, o React Router assume a rota.
      - name: Rotas internas (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
